version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - MODELS_DIR=/app/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

  models:
    image: busybox
    volumes:
      - ./models:/models
    command: sh -c "mkdir -p /models && echo 'Models directory ready'"

volumes:
  models:
